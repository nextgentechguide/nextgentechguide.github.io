<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2159a8">
  {% seo %}
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }} — Feed" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  {% include header.html %}
  <main id="main-content">{{ content }}</main>
  {% include footer.html %}
</body>
</html>
