title: NextGen Tech Guide
description: Practical technology tutorials, IT learning resources, and beginner-friendly guides.
url: "https://nextgentechguide.github.io"
baseurl: ""
lang: en
timezone: Asia/Kolkata
markdown: kramdown
permalink: /blogs/:title/
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
author:
  name: NextGen Tech Guide
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: NextGen Tech Guide
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
